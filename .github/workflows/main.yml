name: GymBuddy CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu GitHub'dan çek
        uses: actions/checkout@v4

      - name: Go ortamını hazırla
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Bağımlılıkları yükle
        # Burada 'cd backend' vardı, sildik çünkü dosyaların ana dizinde
        run: go mod download

      - name: Render'a Otomatik Deploy Et
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
