name: GymBuddy CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu GitHub'dan çek
        uses: actions/checkout@v4  # v3 yerine v4 (Güncel)

      - name: Go ortamını hazırla
        uses: actions/setup-go@v5  # v4 yerine v5 (Güncel)
        with:
          go-version: '1.21'

      - name: Bağımlılıkları yükle
        run: |
          cd backend
          go mod download

      - name: Render'a Otomatik Deploy Et
        # Bu adımda hata alıyorsan RENDER_DEPLOY_HOOK secret'ını kontrol etmeliyiz
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
